apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-api
  template:
    metadata:
      labels:
        app: bank-api
    spec:
      containers:
      - name: bank-pod
        image: bank-prediction-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 9696
---
apiVersion: v1
kind: Service
metadata:
  name: bank-service
spec:
  type: LoadBalancer
  selector:
    app: bank-api
  ports:
  - port: 80
    targetPort: 9696